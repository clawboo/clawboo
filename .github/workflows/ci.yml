name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.changeset/**'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every CI job only reads the repo (checkout + install +
# run checks) and never writes to the repo or PR. A job needing more must opt in
# with its own permissions: block.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  verify-ingest:
    name: Verify marketplace ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Auth the pinned-SHA upstream fetches (raises the GitHub rate limit to
      # 5000/hr; the fetch helper also retries on a transient 429).
      - run: pnpm verify:ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test-bundle:
    name: Smoke test bundled CLI (clean install simulation)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm assemble

      # Simulates `npx clawboo` end-to-end against an isolated state dir,
      # with a fake non-Clawboo listener on port 18791 (mimicking the
      # OpenClaw Gateway auxiliary port that broke v0.1.2). Asserts the
      # CLI's port-discovery correctly skips 18791, the SPA renders, the
      # deep-route catch-all works, and /api/settings returns JSON.
      #
      # Runs on both ubuntu-latest and windows-latest. The Windows run is
      # the regression gate for v0.1.4's Windows-compat fixes (npm.cmd
      # resolution, which→where shim, netstat-based findProcessByPort).
      - run: pnpm test:clean-install

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # UI build + sandboxed Playwright suite (~80–120s build + specs)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # PR-controlled e2e next; don't keep the default token for later steps.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # Runs on every PR and on pushes to main. Config already branches on
      # process.env.CI (forbidOnly, retries, reuseExistingServer).
      - name: Run Playwright e2e
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
