name: Orchestration Evals

# The orchestration eval suite + the ±verifier × ±structured-state ablation
# self-test. Both run with no network and no provider keys. The LLM-as-judge grader
# for the subjective dimensions is defined but NOT yet wired into any task (its live
# path is a deferred canary), so this workflow currently runs the SAME deterministic
# suite the PR gate (`pnpm test`) runs. It is MANUAL-ONLY (workflow_dispatch): trigger
# it on demand from the Actions tab; it is the intended home for the future live
# canary. No untrusted event input is interpolated into any step.

on:
  workflow_dispatch: {}

concurrency:
  group: evals
  cancel-in-progress: true

# Least-privilege default: the eval job only reads the repo and runs tests.
permissions:
  contents: read

jobs:
  evals:
    name: Orchestration evals + ablation scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the eval package + its workspace dependencies (db / obs / governance
      # / executor) so the suite runs against compiled deps.
      - run: pnpm --filter "@clawboo/evals..." build

      - name: Run the deterministic eval suite + the ablation self-test
        run: pnpm --filter @clawboo/evals test
