name: 'Clawboo CodeQL config'

# Shared by both languages in .github/workflows/codeql.yml.
#
# The only exclusion is the marketplace catalog: `catalog/` is agent prompt text
# and team routing prose as JSON, plus the generated artifacts built from it.
# There is no executable logic in any of it, so skipping the directory keeps the
# scan fast without giving up any real coverage.
#
# The CODE that reads it is deliberately NOT excluded. `scripts/catalog/`
# validates and builds, and `apps/web/server/lib/catalogIndex.ts` fetches remote
# bytes and verifies them, which is exactly the kind of taint flow CodeQL is good
# at. The old entries here named `apps/web/src/features/marketplace/agents/agency`
# and `.../teams/agency-workflows.ts`; both paths were replaced by `catalog/`.
#
# Nothing else is excluded. In particular apps/web/server/ stays in scope: it is
# where the Express API, the runtime spawning, and the git-worktree handling
# live, so it is the natural home of the taint-flow bugs (path traversal, SSRF,
# command injection) CodeQL is actually good at. ESLint now covers that tree too
# (`eslint src/ server/`, pinned by importBoundary.test.ts), but the two tools
# answer different questions - style and layering versus data flow.
paths-ignore:
  - catalog
