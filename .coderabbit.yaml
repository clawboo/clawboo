# CodeRabbit configuration. TEMPORARY, and deleted before this PR merges.
#
# The OSS plan caps a review at 100 files, counted after these filters run, so
# this large PR is reviewed in passes. Pass 1 (source, 74 files) is done; this is
# PASS 2: tests only (39 changed test files). With inclusion patterns present,
# only matching files are in scope, so the previously-reviewed source does not
# count against the cap and the never-reviewed tests get their sweep.
#
# DELETE THIS FILE BEFORE MERGE. It is repository configuration, not a per-PR
# switch: left in place it would scope every future PR's review to test files
# only, which is the inverse of useful.
reviews:
  path_filters:
    - '**/__tests__/**'
    - '**/*.test.ts'
    - 'tests/e2e/**'
